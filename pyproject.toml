[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-module-test-automation"
version = "0.1.0"
description = "Modular test automation system for an 8-channel optical module, with simulated instruments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
ate = "ate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not docker'"  # the Docker test runs only when asked: pytest -m docker
markers = [
    "slow: longer statistical tests (run by default; skip with -m 'not slow')",
    "network: starts a real simulator bench on local ports",
    "docker: runs the simulator bench in a Docker container (needs Docker; pytest -m docker)",
]
